      <stop offset=".52" stop-color="#E8B873"/>
      <stop offset=".78" stop-color="#8E4C20"/>
      <stop offset="1" stop-color="#D99B5A"/>
    </linearGradient>
    <radialGradient id="planet" cx="32%" cy="25%" r="78%">
