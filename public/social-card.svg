  <path d="M883 315c31-40 64-58 100-59 42-1 72 20 98 62m-194 21c40 22 92 25 144 5" fill="none" stroke="#F4F9F9" stroke-width="7" stroke-linecap="round" opacity=".8"/>
  <ellipse cx="973" cy="314" rx="239" ry="79" transform="rotate(-24 973 314)" fill="none" stroke="url(#copper)" stroke-width="17"/>
  <circle cx="1182" cy="212" r="18" fill="url(#copper)"/>
  <circle cx="775" cy="378" r="13" fill="url(#copper)"/>
  <circle cx="1047" cy="84" r="10" fill="url(#copper)"/>
  <text x="95" y="168" fill="#2D5A27" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="8">MUSE PLANET · HONG KONG</text>
  <text x="90" y="300" fill="#1E293B" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="63" font-weight="750">沐智星球</text>
